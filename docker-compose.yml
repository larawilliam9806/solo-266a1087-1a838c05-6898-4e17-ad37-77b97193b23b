services:
  checker:
    build: .
    container_name: newspaper-coverage-checker
    ports:
      - "8000:8000"
    environment:
      NEWSPAPER_DB: /data/checker.db
    volumes:
      - checker-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  checker-data:
